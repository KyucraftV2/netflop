<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Netflop</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #141414;
        color: #e5e5e5;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      h1 {
        margin: 0 0 2rem;
        text-align: center;
        color: #e50914;
        letter-spacing: 0.04em;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 240px);
        gap: 24px;
      }
      a {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 140px;
        border-radius: 12px;
        text-decoration: none;
        color: #fff;
        font-size: 1.6rem;
        font-weight: 700;
        transition: transform 0.15s ease;
      }
      a:hover,
      a:focus-visible {
        transform: scale(1.04);
        outline: 3px solid #fff;
      }
      small {
        font-size: 0.8rem;
        font-weight: 400;
        opacity: 0.85;
        margin-top: 0.4rem;
      }
      .netflix {
        background: #b20710;
      }
      .canal {
        background: #1a1a1a;
        border: 2px solid #3a3a3a;
      }
      .francetv {
        background: #1d3fbb;
      }
      p {
        text-align: center;
        color: #a3a3a3;
        margin-top: 2rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>NETFLOP</h1>
      <div class="grid">
        <a class="netflix" href="https://www.netflix.com/browse">Netflix</a>
        <a class="canal" href="https://www.canalplus.com/"
          >Canal+<small>inclut HBO Max et Apple TV+</small></a
        >
        <a class="francetv" href="https://www.france.tv/">france.tv</a>
      </div>
      <p>Connecte-toi une fois à chaque plateforme : ça restera enregistré.</p>
    </main>
  </body>
</html>
