name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualite:
    name: Lint, types, format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run format:check

  tests:
    name: Tests unitaires et d'intégration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netflop
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: netflop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netflop" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://netflop@127.0.0.1:5432/netflop_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test

  e2e:
    name: Build et parcours Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netflop
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: netflop_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netflop" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://netflop@127.0.0.1:5432/netflop_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
