version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      mineures:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint ne gère pas encore TypeScript 7 (à réévaluer).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directories: [/, /browser]
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Une version majeure de Postgres demande une sauvegarde/restauration (README) :
      # montée faite à la main, jamais automatiquement.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "docker"
